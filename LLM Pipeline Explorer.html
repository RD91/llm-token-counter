<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLM Pipeline Explorer</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--ac:#5b4bdb;--ac2:#e0613a;--bd:#e2e0d8;--chip:#eeecff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--card:#1f1f26;--tx:#eceae4;--mut:#9a98a0;--ac:#9a8cff;--ac2:#ff8a63;--bd:#33333d;--chip:#2c2a48;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15151a;--card:#1f1f26;--tx:#eceae4;--mut:#9a98a0;--ac:#9a8cff;--ac2:#ff8a63;--bd:#33333d;--chip:#2c2a48;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 24px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:20px}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;margin-top:10px;cursor:pointer}
button.alt{background:var(--ac2)}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.row input{flex:1;min-width:180px}.row button{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border-radius:8px;padding:3px 8px;font:13px ui-monospace,monospace}
.chip b{color:var(--ac);margin-left:6px}.chip.unk{background:#ffe3dc;color:#a33}
.note{color:var(--mut);font-size:13px;margin-top:8px}
canvas{width:100%;height:420px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);touch-action:none;cursor:grab;margin-top:12px}
.legend{font-size:13px;color:var(--mut);margin-top:6px}
</style></head><body><main>
<h1>LLM Pipeline Explorer</h1>
<p class="sub">How text becomes tokens, and then becomes points in 3D space.</p>

<section>
<h2>1. Tokenizer</h2>
<label for="corpus">Sentences to learn words from</label>
<textarea id="corpus">the cat sat on the mat
the dog sat on the rug
a cat chased the mouse
the dog chased the cat
cars drive on the road
trucks drive on the highway</textarea>
<button id="build">Build vocabulary</button>
<div class="chips" id="vocab"></div>
<label for="enc">Encode a sentence</label>
<div class="row"><input id="enc" value="the cat chased a truck"><button id="tok" class="alt">Tokenize</button></div>
<div class="chips" id="encOut"></div>
<div class="note" id="tokNote"></div>
</section>

<section>
<h2>2. Embeddings in 3D</h2>
<label for="sents">Sentences (one per line)</label>
<textarea id="sents">the cat sat on the mat
the dog sat on the rug
a cat chased the mouse
cars drive on the road
trucks drive on the highway
the dog chased the cat</textarea>
<button id="embed">Embed and plot</button>
<label for="own">Try your own word or sentence</label>
<div class="row"><input id="own" value="the mouse sat on the road"><button id="add" class="alt">Tokenize, embed &amp; add to plot</button></div>
<div class="note" id="embNote"></div>
<canvas id="cv" width="820" height="420"></canvas>
<div class="legend">Drag to rotate. Small dots = words, purple = sentences, orange = your input. Similar contexts land close together.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const tokenize=s=>(s.toLowerCase().match(/[a-z0-9’']+|[^\sa-z0-9]/g)||[]);
const lines=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
let vocab=new Map();

function buildVocab(){
  vocab=new Map([["<pad>",0],["<unk>",1]]);
  lines($("corpus").value).forEach(l=>tokenize(l).forEach(t=>{if(!vocab.has(t))vocab.set(t,vocab.size)}));
  $("vocab").innerHTML=[...vocab].map(([w,i])=>`<span class="chip">${esc(w)}<b>${i}</b></span>`).join("");
  $("tokNote").textContent=vocab.size+" tokens in vocabulary (including <pad> and <unk>).";
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function encode(){
  if(vocab.size<2)buildVocab();
  const toks=tokenize($("enc").value);
  $("encOut").innerHTML=toks.map(t=>{const k=vocab.has(t);return `<span class="chip ${k?"":"unk"}">${esc(t)}<b>${k?vocab.get(t):1}</b></span>`}).join("");
  $("tokNote").textContent="IDs: ["+toks.map(t=>vocab.has(t)?vocab.get(t):1).join(", ")+"]  (unknown words map to <unk> = 1)";
}

/* Embeddings: co-occurrence -> PPMI vectors -> PCA to 3D */
let E=null,pts=[];
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s}
function embedAll(){
  const S=lines($("sents").value);
  const all=[...S,...lines($("corpus").value)];
  const words=[...new Set(all.flatMap(tokenize))],ix=new Map(words.map((w,i)=>[w,i])),V=words.length;
  const M=Array.from({length:V},()=>new Float64Array(V));
  all.forEach(l=>{const t=tokenize(l).map(w=>ix.get(w));
    t.forEach((a,i)=>{for(let j=Math.max(0,i-2);j<=Math.min(t.length-1,i+2);j++)if(j!==i)M[a][t[j]]+=1})});
  const rs=M.map(r=>r.reduce((a,b)=>a+b,0)),tot=rs.reduce((a,b)=>a+b,0)||1;
  const W=M.map((r,i)=>{const o=new Float64Array(V);for(let j=0;j<V;j++)if(r[j]>0)o[j]=Math.max(0,Math.log(r[j]*tot/(rs[i]*rs[j])));
    const n=Math.sqrt(dot(o,o))||1;return o.map(x=>x/n)});
  const mean=new Float64Array(V);W.forEach(w=>w.forEach((x,j)=>mean[j]+=x/V));
  const X=W.map(w=>w.map((x,j)=>x-mean[j]));
  const C=Array.from({length:V},(_,i)=>new Float64Array(V));
  X.forEach(x=>{for(let i=0;i<V;i++)for(let j=0;j<V;j++)C[i][j]+=x[i]*x[j]});
  const comps=[];
  for(let k=0;k<3;k++){
    let v=new Float64Array(V).map((_,i)=>Math.sin(i*7.3+k+1));
    for(let it=0;it<80;it++){
      const n=new Float64Array(V);for(let i=0;i<V;i++)n[i]=dot(C[i],v);
      const nr=Math.sqrt(dot(n,n))||1;v=n.map(x=>x/nr);}
    const lam=dot(v,C.map(r=>dot(r,v)));
    for(let i=0;i<V;i++)for(let j=0;j<V;j++)C[i][j]-=lam*v[i]*v[j];
    comps.push(v);
  }
  E={words,ix,W,mean,comps,V};
  const proj=v=>comps.map(c=>{let s=0;for(let j=0;j<V;j++)s+=(v[j]-mean[j])*c[j];return s});
  E.proj=proj;
  pts=[];
  words.forEach((w,i)=>pts.push({l:w,p:proj(W[i]),t:"w"}));
  S.forEach(s=>{const p=sentPoint(s);if(p)pts.push({l:s,p,t:"s"})});
  normalize();
  $("embNote").textContent=`${V} words embedded; ${S.length} sentences plotted. Each sentence = average of its word vectors.`;
}
function sentVec(s){
  const ks=tokenize(s).filter(t=>E.ix.has(t));if(!ks.length)return null;
  const v=new Float64Array(E.V);ks.forEach(t=>E.W[E.ix.get(t)].forEach((x,j)=>v[j]+=x/ks.length));return v;
}
function sentPoint(s){const v=sentVec(s);return v?E.proj(v):null}
let scale=1;
function normalize(){
  const m=Math.max(1e-9,...pts.flatMap(p=>p.p.map(Math.abs)));scale=1/m;
}
function addOwn(){
  if(!E)embedAll();
  const s=$("own").value.trim();if(!s)return;
  const toks=tokenize(s),unk=toks.filter(t=>!E.ix.has(t));
  const p=sentPoint(s);
  if(!p){$("embNote").textContent="None of those words appear in the training sentences, so there is nothing to embed.";return}
  pts.push({l:s,p,t:"o"});normalize();
  $("embNote").textContent=unk.length?`Ignored unknown words: ${unk.join(", ")}.`:"Added to the plot.";
}

/* 3D canvas */
const cv=$("cv"),cx=cv.getContext("2d");let yaw=0.6,pitch=0.35,drag=null;
cv.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointerup",()=>drag=null);
cv.addEventListener("pointermove",e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*0.01;pitch+=(e.clientY-drag[1])*0.01;
  pitch=Math.max(-1.5,Math.min(1.5,pitch));drag=[e.clientX,e.clientY]});
function rot(p){
  const [x,y,z]=p.map(v=>v*scale);
  const x1=x*Math.cos(yaw)-z*Math.sin(yaw),z1=x*Math.sin(yaw)+z*Math.cos(yaw);
  const y1=y*Math.cos(pitch)-z1*Math.sin(pitch),z2=y*Math.sin(pitch)+z1*Math.cos(pitch);
  return [x1,y1,z2];
}
function draw(){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement),tx=cs.getPropertyValue("--tx"),mu=cs.getPropertyValue("--mut"),ac=cs.getPropertyValue("--ac"),ac2=cs.getPropertyValue("--ac2");
  const R=Math.min(w,h)*0.38,proj=q=>{const f=3/(3+q[2]*0.8);return [w/2+q[0]*R*f,h/2-q[1]*R*f,f]};
  cx.lineWidth=1;cx.font="11px system-ui";
  [["x",[1,0,0]],["y",[0,1,0]],["z",[0,0,1]]].forEach(([n,a])=>{
    const A=proj(rot(a.map(v=>-v/scale))),B=proj(rot(a.map(v=>v/scale)));
    cx.strokeStyle=mu;cx.globalAlpha=.35;cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
    cx.globalAlpha=.8;cx.fillStyle=mu;cx.fillText("PC"+(n=="x"?1:n=="y"?2:3),B[0]+4,B[1]);});
  if(!pts.length){cx.globalAlpha=1;cx.fillStyle=mu;cx.font="14px system-ui";cx.fillText("Press “Embed and plot” to see the points.",20,30);requestAnimationFrame(draw);return}
  const L=pts.map(p=>{const q=rot(p.p);return {p,q,s:proj(q)}}).sort((a,b)=>b.q[2]-a.q[2]);
  L.forEach(({p,s})=>{
    const big=p.t!=="w";cx.globalAlpha=Math.min(1,.45+s[2]*.4);
    cx.fillStyle=p.t==="o"?ac2:p.t==="s"?ac:mu;
    cx.beginPath();cx.arc(s[0],s[1],(big?6:3.5)*s[2],0,7);cx.fill();
    cx.fillStyle=tx;cx.font=(big?"12px":"11px")+" system-ui";
    const lab=p.l.length>26?p.l.slice(0,25)+"…":p.l;cx.fillText(lab,s[0]+8,s[1]+4);});
  cx.globalAlpha=1;requestAnimationFrame(draw);
}
$("build").onclick=buildVocab;$("tok").onclick=encode;
$("embed").onclick=embedAll;$("add").onclick=addOwn;
buildVocab();encode();embedAll();draw();
</script></body></html>
